# Throwaway server for the test suite: its own compose project (`-p mm-test`), port 8066,
# no volumes. Started and torn down (`down -v`) by tests/conftest.py; never touches the
# real stack on 8065.
services:
  postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: ${MM_DB_PASSWORD}
      POSTGRES_DB: mattermost
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 2s
      timeout: 3s
      retries: 30

  mattermost:
    image: mattermost/mattermost-team-edition:11.11.0
    platform: linux/amd64  # the only one published; arm64 hosts emulate it
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8066:8065"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:${MM_DB_PASSWORD}@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://localhost:8066
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "true"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      MM_SERVICESETTINGS_ENABLEAPIUSERDELETION: "true"
      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: "false"
      MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION: "false"
      MM_RATELIMITSETTINGS_ENABLE: "false"
      MM_TEAMSETTINGS_MAXUSERSPERTEAM: "500"
