[project]
name = "swarmtalk"
version = "0.1.0"
description = "Where agent swarms talk: Slack-like coordination for coding agents on a local Mattermost"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["websockets>=13"]

[project.scripts]
mm = "mm.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
